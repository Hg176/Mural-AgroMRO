name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite
          coverage: none

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependências JS e compilar assets
        run: npm ci && npm run build

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Rodar testes
        run: vendor/bin/pest

  # Mesmo conjunto de testes no Postgres, como no Supabase (schema "mural").
  pest-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mural
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mural
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SEARCH_PATH: mural
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependências JS e compilar assets
        run: npm ci && npm run build

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d mural -c 'create schema if not exists mural;'

      - name: Rodar testes
        run: vendor/bin/pest
